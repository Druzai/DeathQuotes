# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx5G
org.gradle.daemon=false
org.gradle.debug=false

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
# On other mod loaders it's set to 'true'.
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

## Environment Properties

# The Minecraft version that your mod is targeting.
minecraft_version=26.1
# Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
minecraft_java_build_version=25

# Common Properties
common_log4j_api_version=2.25.2

## Forge Properties

# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
forge_minecraft_version_range=[26.1,26.2)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=62.0.9
# The Forge version range can use any version of Forge as bounds or match the loader version range
forge_version_range=[62,)
# The loader version range can only use the major version of Forge/FML as bounds
forge_loader_version_range=[62,)
net.minecraftforge.gradle.merge-source-sets=true

## NeoForge Properties

# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
neoforge_minecraft_version_range=[1.26.1,1.26.2)
# The Neo version must agree with the Minecraft version to get a valid artifact
neoforge_version=26.1.0.19-beta
# The Neo version range can use any version of Neo as bounds
neoforge_version_range=[26.1.0.19-beta,)
# The loader version range can only use the major version of FML as bounds
neoforge_loader_version_range=[1,)

## Fabric Properties

# check these on https://fabricmc.net/versions.html
fabric_loader_version=0.18.6
fabric_loom_version=1.16-SNAPSHOT
# The Minecraft versions can use any release version of Minecraft as bounds.
fabric_minecraft_versions=26.1.x
# Dependencies
fabric_api_version=0.144.4+26.1
fabric_night_config_version=3.8.4

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=deathquotes
# The human-readable display name for the mod.
mod_name=DeathQuotes
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=3.4
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.cazsius.deathquotes
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=deathquotesteam
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Adding Unique, Customizable quotes when a player dies!
# Link to mod's home page
mod_curseforge_link=https://www.curseforge.com/minecraft/mc-mods/deathquotes-death-quotes
# Link to sources
mod_github_link=https://github.com/Druzai/DeathQuotes